name: Build & test

on:
  push:
    tags-ignore: 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go environment
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.1'

    - name: Download dependencies
      run: go mod download

    - name: Lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.11.3

    - name: Build
      run: go build -v ./...

    - name: Check formatting
      run: |
        go install mvdan.cc/gofumpt@v0.11.0
        test -z "$(gofumpt -extra -l .)" || { gofumpt -extra -d .; exit 1; }

    - name: Test
      run: go test -race -shuffle=on -v ./...
