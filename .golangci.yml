version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocritic
    - gosec
    - errorlint
    - prealloc
    - unparam
    - nilerr
    - forcetypeassert
    - makezero
    - goconst
    - misspell
  settings:
    revive:
      rules:
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: var-naming
    goconst:
      min-len: 3
      min-occurrences: 3
    gosec:
      excludes:
        - G706 # Log injection — expected for a debugging proxy that logs HTTP traffic
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - gosec
          - goconst # repeated literals in table-driven test cases are intentional
          - unparam # test doubles have signatures fixed by the interface they implement
      # Parsing untrusted XML is the point of the highlighter, and encoding/xml
      # never resolves external entities or expands DTDs, so there is no XXE or
      # entity-expansion exposure. Output size is bounded by maxIndentDepth in
      # highlight.go; the input size cap alone is not sufficient, because
      # indentation is written per token and would otherwise be quadratic in
      # nesting depth. Matched by text rather than listed under gosec.excludes,
      # because G709 is newer than the golangci-lint version pinned in CI and
      # would fail `config verify` there.
      - path: highlight\.go
        linters:
          - gosec
        text: 'G709'
